# Required whenever the project uses androidx dependencies. Without
# it the build stops with:
#   "This project uses AndroidX dependencies, but the
#    'android.useAndroidX' property is not enabled."
android.useAndroidX=true

# Not using any old support-library artifacts, so no rewriting needed.
android.enableJetifier=false

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
