<!doctype html>
<!-- Bundled inside the app so it works with no connection at all.
     The previous version showed a toast and then a blank white
     screen. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>No connection</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115; color: #f3f4f6;
    padding: 24px; text-align: center;
  }
  .mark { font-size: 34px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 16px; }
  .mark span { color: #e11d48; }
  h1 { font-size: 21px; margin: 0 0 10px; }
  p { color: #9ca3af; margin: 0; line-height: 1.6; font-size: 15px; max-width: 320px; }
  .hint { margin-top: 22px; font-size: 13px; color: #6b7280; }
</style>
</head>
<body>
  <div>
    <div class="mark">Daily<span>Post</span></div>
    <h1>You're offline</h1>
    <p>DailyPost needs an internet connection to load stories.</p>
    <p class="hint">Pull down to try again.</p>
  </div>
</body>
</html>
